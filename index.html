<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Federico D'Avella | Workflow</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Workflow">
<link rel="icon" href="/icon-180.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #f5f5f7; }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
  #wf-boot { min-height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
  #wf-boot img { width: 64px; height: 64px; border-radius: 16px; animation: wfpulse 1.6s ease-in-out infinite; }
  #wf-boot p { margin: 16px 0 0; color: #86868b; letter-spacing: .02em; }
  #wf-boot a, #wf-boot button { color: #2997ff; background: none; border: 0; font: inherit; cursor: pointer; padding: 0; text-decoration: none; }
  #wf-boot .err { max-width: 340px; }
  @keyframes wfpulse { 50% { opacity: .45; transform: scale(.96); } }
  @media (prefers-reduced-motion: reduce) { #wf-boot img { animation: none; } }
</style>
</head>
<body>
<div id="wf-boot"><div><img src="/icon-180.png" alt=""><p id="wf-msg">Caricamento…</p></div></div>
<script>
/* Federico D'Avella | Workflow — pagina di app.federicodavella.com.
   Carica l'app vera dal "motore" su Google Apps Script e la mostra qui. Una copia resta sul telefono/computer,
   così l'app si apre subito. Quando esce una versione nuova (controllo all'apertura e ogni volta che l'app torna
   in primo piano) viene scaricata e compare "Nuova versione pronta · Aggiorna". */
(function () {
  var EXEC = "https://script.google.com/macros/s/AKfycbwcfXZmdbpUwdDFBPRaLBot-q4M7a3ZP1FduyQW0DtR8x2eXvz_Ya8CCekZ0S-6YSRbUA/exec";
  var KEY = "wf-page-v1", shown = false, shownVer = "", busy = false, lastCheck = 0, ready = false;
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function put(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* spazio pieno: si riscarica la prossima volta */ } }
  function valid(h) { return typeof h === "string" && /^\s*<!doctype html/i.test(h) && h.length > 20000; }
  function verOf(h) { var m = /<meta name="wf-ver" content="([^"]*)">/.exec(h || ""); return m ? m[1] : ""; }
  function show(html) {
    if (shown) return; shown = true; shownVer = verOf(html);
    document.open(); document.write(html); document.close();
    arm(); /* gli ascoltatori vanno messi dopo document.open, che cancella quelli di prima */
  }
  function fail() {
    if (shown) return;
    var m = document.getElementById("wf-msg");
    if (m) m.parentNode.innerHTML = '<img src="/icon-180.png" alt=""><p class="err">Non riesco a raggiungere l\'app in questo momento. Controlla la connessione e <button type="button" onclick="location.reload()">riprova</button>.</p>';
  }
  /* avviso in basso: la versione nuova è già scaricata, basta ricaricare */
  function notify() {
    if (ready) return; ready = true;
    var go = function () {
      if (!document.body) return setTimeout(go, 300);
      if (document.getElementById("wf-upd")) return;
      var d = document.createElement("div");
      d.id = "wf-upd"; d.setAttribute("role", "status");
      d.style.cssText = "position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2147483000;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);padding:10px 10px 10px 18px;border-radius:999px;background:rgba(28,28,30,.96);color:#f5f5f7;font:500 14px/1.3 -apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.14)";
      d.innerHTML = '<span>Nuova versione dell\'app pronta</span><button type="button" style="border:0;border-radius:999px;padding:8px 16px;background:#0071e3;color:#fff;font:600 14px/1 -apple-system,BlinkMacSystemFont,Arial,sans-serif;cursor:pointer">Aggiorna</button>';
      d.querySelector("button").onclick = function () { location.reload(); };
      document.body.appendChild(d);
    };
    go();
  }
  function fetchPage() {
    return fetch(EXEC + "?raw=1", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (h) { if (!valid(h)) throw new Error("pagina non valida"); put(KEY, h); return h; });
  }
  /* la pagina scaricata è diversa da quella aperta? */
  function differs(h) { var v = verOf(h); return v ? v !== shownVer : h !== cached; }
  /* controllo leggero: chiede solo il numero di versione; se è cambiato scarica la pagina nuova */
  function check() {
    if (!shown || busy || ready || Date.now() - lastCheck < 60000) return;
    busy = true; lastCheck = Date.now();
    fetch(EXEC + "?ver=1", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : ""; })
      .then(function (v) {
        v = String(v || "").trim();
        if (!v || v === shownVer) return;
        var saved = get(KEY);
        if (valid(saved) && verOf(saved) === v) return notify();
        return fetchPage().then(function (h) { if (differs(h)) notify(); });
      })
      .catch(function () { /* niente rete: riprova più tardi */ })
      .then(function () { busy = false; });
  }
  var cached = get(KEY);
  if (!valid(cached)) cached = null;
  var fresh = fetchPage();
  if (cached) {
    /* l'app si apre subito con la copia salvata; se intanto arriva una versione diversa compare "Aggiorna" */
    setTimeout(function () { show(cached); }, 0);
    fresh.then(function (h) { lastCheck = Date.now(); if (differs(h)) notify(); }, function () { /* niente rete: resta la copia salvata */ });
  } else {
    fresh.then(function (h) { lastCheck = Date.now(); show(h); }, fail);
  }
  /* quando l'app torna in primo piano (anche dal multitasking del telefono) e ogni 10 minuti */
  function arm() {
    var vis = function () { if (document.visibilityState === "visible") check(); };
    document.addEventListener("visibilitychange", vis);
    window.addEventListener("pageshow", vis);
    window.addEventListener("focus", vis);
    setInterval(vis, 600000);
  }
})();
</script>
</body>
</html>
